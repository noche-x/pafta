<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pafta</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #12161d; }
      canvas { display: block; width: 100%; height: 100%; outline: 0; }
      #status { position: fixed; left: 12px; bottom: 8px; color: #7e8b9d; font: 12px system-ui, sans-serif; pointer-events: none; }
      #loading { position: fixed; inset: 0; z-index: 1; display: grid; place-content: center; gap: 12px; padding: 24px; background: #12161d; color: #e5e9ef; font: 16px system-ui, sans-serif; text-align: center; }
      #loading[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    <div id="status">Pafta · WebAssembly</div>
    <div id="loading" role="status" aria-live="polite">
      <strong id="loading-title">Loading Pafta</strong>
      <div id="loading-message">Downloading the editor...</div>
    </div>
    <script>
      var Module;
      (function() {
      const loading = document.getElementById('loading');
      const message = document.getElementById('loading-message');
      let started = false;
      let failed = false;
      const timeout = setTimeout(function() {
        if (!started) fail('The editor did not start. Check your connection or browser extensions, then refresh.');
      }, 60000);

      function fail(text) {
        if (failed) return;
        failed = true;
        clearTimeout(timeout);
        document.getElementById('loading-title').textContent = 'Pafta could not start';
        message.textContent = text;
        loading.hidden = false;
      }

      window.addEventListener('error', function(event) {
        if (started) return;
        if (event.target instanceof HTMLScriptElement && event.target.src.includes('map_editor_web.') && event.target.src.endsWith('.js')) {
          fail('The editor script was blocked or could not be downloaded. Allow noche.im in your blocker, then refresh.');
        } else if (event.error) {
          fail('The editor failed to start: ' + event.message);
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (!started) fail('The editor failed to start: ' + event.reason);
      });

      Module = {
        canvas: document.getElementById('canvas'),
        print: function(text) { console.log(text); },
        printErr: function(text) { console.error(text); },
        onAbort: function(reason) { fail('The editor stopped: ' + reason); },
        instantiateWasm: function(imports, successCallback) {
          (async function() {
            const response = await fetch('map_editor_web.wasm', { credentials: 'same-origin' });
            if (!response.ok) throw new Error('WebAssembly download failed (HTTP ' + response.status + ')');

            const total = Number(response.headers.get('Content-Length'));
            const reader = response.body && response.body.getReader();
            let binary;
            if (reader) {
              const chunks = [];
              let received = 0;
              while (true) {
                const result = await reader.read();
                if (result.done) break;
                chunks.push(result.value);
                received += result.value.length;
                if (!failed) message.textContent = 'Downloading WebAssembly... ' + (total ? Math.round(received / total * 100) + '%' : Math.round(received / 1024) + ' KiB');
              }
              binary = await new Blob(chunks).arrayBuffer();
            } else {
              binary = await response.arrayBuffer();
            }

            if (!failed) message.textContent = 'Starting the editor...';
            const result = await WebAssembly.instantiate(binary, imports);
            successCallback(result.instance, result.module);
          })().catch(function(error) {
            console.error(error);
            fail('WebAssembly could not load: ' + error.message + '. Check your connection or blocker, then refresh.');
          });
        },
        onRuntimeInitialized: function() {
          started = true;
          clearTimeout(timeout);
          requestAnimationFrame(function() { requestAnimationFrame(function() { if (!failed) loading.hidden = true; }); });
          if (typeof window.mapEditorBrowserInstallDropTarget === 'function') {
            window.mapEditorBrowserInstallDropTarget(document.getElementById('canvas'));
          }
        }
      };
      })();
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
