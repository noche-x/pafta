name: Build, test, and package Pafta

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_pages:
        description: Publish the browser beta to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, os: ubuntu-latest, preset: ci, executable: build/ci/pafta}
          - {platform: macos, os: macos-latest, preset: ci, executable: build/ci/pafta}
          - {platform: windows, os: windows-2022, preset: ci-msvc, executable: build/ci-msvc/Release/pafta.exe}

    steps:
      - uses: actions/checkout@v4
      - name: Install Linux graphics build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libglu1-mesa-dev libgtk-3-dev \
            libx11-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev \
            libxrandr-dev mesa-common-dev xorg-dev
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --schedule-random
      - name: Package beta build
        shell: bash
        run: |
          mkdir -p dist/package
          cmake --install "build/${{ matrix.preset }}" --config Release --prefix dist/package --component Pafta
          printf 'Platform: %s\nArchitecture: %s\nSource revision: %s\n' '${{ matrix.platform }}' '${{ runner.arch }}' "$GITHUB_SHA" > dist/package/BUILD_INFO.txt
          (cd dist/package && cmake -E tar cf ../pafta-${{ matrix.platform }}.zip --format=zip pafta* ${{ matrix.platform == 'macos' && 'Pafta.app' || '' }} assets BUILD_INFO.txt LICENSE README.md CONTRIBUTING.md STYLE_GUIDE.md THIRD_PARTY_NOTICES.md docs licenses)
          mkdir -p dist/smoke
          (cd dist/smoke && cmake -E tar xf ../pafta-${{ matrix.platform }}.zip)
          python -c "import struct; from pathlib import Path; Path('dist/smoke/smoke.csx').write_bytes(struct.pack('<III', 0, 13, 1) + bytes([1]) + struct.pack('<III52s', 0, 12, 1, b'smoke'))"
          executable=$(basename '${{ matrix.executable }}')
          (cd dist/smoke && "./$executable" --check smoke.csx)
          test -f dist/smoke/licenses/OFL-1.1.txt
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: pafta-${{ matrix.platform }}
          path: dist/pafta-${{ matrix.platform }}.zip
          if-no-files-found: error

      - name: Package corresponding source
        if: matrix.platform == 'linux'
        run: python3 scripts/package_source.py build/ci dist/pafta-source.tar.gz
      - name: Upload corresponding source
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: pafta-source
          path: dist/pafta-source.tar.gz
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libasound2-dev libgl1-mesa-dev libgtk-3-dev \
            libglu1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxi-dev \
            libxinerama-dev libxrandr-dev mesa-common-dev xorg-dev
      - name: Test with source coverage
        run: bash tests/coverage.sh
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: pafta-coverage
          path: |
            build/coverage/coverage.txt
            build/coverage/coverage-export.txt
            build/coverage/coverage-workflows.txt
            build/coverage/coverage-html/
          if-no-files-found: error

  native-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install native check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy libasound2-dev libgl1-mesa-dev libgtk-3-dev \
            libglu1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxi-dev \
            libxinerama-dev libxrandr-dev mesa-common-dev xorg-dev
      - name: Configure
        run: cmake --preset quality
      - name: Build
        run: cmake --build --preset quality --parallel 2
      - name: Sanitizer tests and bounded parser fuzzing
        run: ctest --preset quality
      - name: Check CPU code with clang-tidy
        run: bash tests/check_cpp.sh
      - name: Keep fuzz inputs and failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pafta-fuzz-inputs
          path: build/quality/fuzz/
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.8
      - name: Configure browser build
        run: |
          EM_CACHE="$PWD/build/web/emcache" emcmake cmake -S . -B build/web \
            -DPLATFORM=Web \
            -DGRAPHICS=GRAPHICS_API_OPENGL_ES3 \
            -DPAFTA_BUILD_TESTS=OFF \
            -DPAFTA_ENABLE_PROFILER=OFF
      - name: Build browser editor
        run: EM_CACHE="$PWD/build/web/emcache" EMCC_BATCH_BUILD=0 cmake --build build/web --target pafta_web --parallel 2
      - name: Package browser build
        run: |
          mkdir -p dist/site
          cp build/web/pafta_web.html dist/site/index.html
          cp build/web/pafta_web.js build/web/pafta_web.wasm dist/site/
          mkdir -p dist/site/assets/branding
          cp assets/branding/pafta.png dist/site/assets/branding/
          cp LICENSE README.md CONTRIBUTING.md STYLE_GUIDE.md THIRD_PARTY_NOTICES.md dist/site/
          cp -R docs licenses dist/site/
          touch dist/site/.nojekyll
          test ! -e build/web/pafta_web.data
          (cd dist/site && cmake -E tar cf ../pafta-web.zip --format=zip assets index.html pafta_web.js pafta_web.wasm .nojekyll LICENSE README.md CONTRIBUTING.md STYLE_GUIDE.md THIRD_PARTY_NOTICES.md docs licenses)
      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: pafta-web
          path: dist/pafta-web.zip
          if-no-files-found: error
      - name: Upload Pages files
        uses: actions/upload-artifact@v4
        with:
          name: pafta-web-site
          path: dist/site/
          include-hidden-files: true
          if-no-files-found: error

  pages:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pages && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [build-test, coverage, native-quality, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pafta-web-site
          path: dist/site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  nightly-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build-test, coverage, native-quality, web]
    runs-on: ubuntu-latest
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pafta-*
          path: release-assets
          merge-multiple: true
      - name: Publish latest successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An older run can finish after a newer run; keep the newer packages.
          release_tags=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          if grep -qx nightly <<< "$release_tags"; then
            published_run=$(gh release view nightly --json body --jq '.body' | sed -n 's/^Build run: \([0-9]*\)$/\1/p')
            if [ -n "$published_run" ] && [ "$published_run" -ge "$GITHUB_RUN_NUMBER" ]; then
              exit 0
            fi
          else
            gh release create nightly --target "$GITHUB_SHA" --title "Latest development build" --prerelease --notes "Build run: $GITHUB_RUN_NUMBER"
          fi
          gh release upload nightly release-assets/pafta-*.zip release-assets/pafta-source.tar.gz --clobber
          gh release edit nightly --notes "Build run: $GITHUB_RUN_NUMBER"

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, coverage, native-quality, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pafta-*
          path: release-assets
          merge-multiple: true
      - name: Create draft beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/pafta-*.zip release-assets/pafta-source.tar.gz --verify-tag --draft --prerelease --generate-notes
